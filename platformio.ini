; PlatformIO Project Configuration File
;
;   Build options: build flags, source filter
;   Upload options: custom upload port, speed and extra flags
;   Library options: dependencies, extra library storages
;   Advanced options: extra scripting
;
; Please visit documentation for the other options and examples
; http://docs.platformio.org/page/projectconf.html

[platformio]
default_envs = station

[env]
platform = https://github.com/pioarduino/platform-espressif32/releases/download/stable/platform-espressif32.zip
framework = arduino

lib_deps =  
    https://github.com/fjulian79/libversion.git#main
    https://github.com/fjulian79/libgeneric.git#main
    fjulian79/libCli
    jgromes/RadioLib@^7.4.0
    adafruit/Adafruit SSD1306@^2.5.13
    adafruit/Adafruit GFX Library@^1.11.11
lib_ldf_mode = deep
monitor_speed = 115200
; Behave like picocom: libCli echoes and edits the line itself, so no local
; echo, Enter sends CR only and the raw byte stream is passed through so the
; VT100 sequences (colored prompt, backspace, history) reach the terminal.
; Note: esp32_exception_decoder buffers output until a newline, which hides
; the prompt and typed characters. Use it on demand for crash analysis:
;   pio device monitor -f esp32_exception_decoder
monitor_eol = CR
monitor_echo = false
monitor_filters = direct

[env:station]
board = nodemcu-32s
build_flags =
    ${env.build_flags}
    -D CLI_PROMPT="\"\\u001b[1;32mcc1101-station$ \\u001b[0m\""
    -D CC1101_STATION
    
[env:mobile]
board = lolin_D32
build_flags =
    ${env.build_flags}
    -D CLI_PROMPT="\"\\u001b[1;32mcc1101-mobile$ \\u001b[0m\""
    -D CC1101_MOBILE
